name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels an in-progress run for the same branch/PR when a new commit lands,
# so only the latest push on a branch keeps consuming runner time
# (development-plan.md §14.5).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-only-check:
    runs-on: windows-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine whether only Markdown files changed
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: docs-only-check
    if: needs.docs-only-check.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: repodeck-release-binaries
          path: |
            target/release/repodeck.exe
            target/release/repodeck-hook.exe
          if-no-files-found: error
