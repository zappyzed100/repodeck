[package]
name = "repodeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
build = "build.rs"

[lib]
name = "repodeck"
path = "src/lib.rs"

[[bin]]
name = "repodeck"
path = "src/main.rs"

[[bin]]
name = "repodeck-hook"
path = "src/bin/repodeck-hook.rs"

[dependencies]
slint = { version = "1.17", features = ["system-tray", "raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
raw-window-handle = "0.6"
time = { version = "0.3", features = ["formatting", "parsing"] }
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
resvg = "0.47"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.17"
embed-manifest = "1.5"
resvg = "0.47"
ico = "0.5"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[lints.clippy]
all = { level = "warn", priority = -1 }
